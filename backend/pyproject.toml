[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.39",
    "botocore>=1.42.39",
    "chromadb>=0.4.0",
    "cohere>=5.20.2",
    "fastapi>=0.128.0",
    "google-generativeai>=0.8.6",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-together>=0.2.0",
    "langgraph>=1.0.1",
    "llama-index>=0.9.0",
    "llama-index-embeddings-gemini>=0.1.0",
    "llama-index-vector-stores-chroma>=0.1.0",
    "neo4j>=6.1.0",
    "openai>=2.16.0",
    "pandas>=2.0.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.28.0",
    "sqlalchemy>=2.0.46",
    "tqdm>=4.66.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "faker>=10.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "app", "domain", "infra", "shared"]

